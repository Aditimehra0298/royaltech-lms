# Railway defaults for Royal Tech LMS
# Avoid `npm ci` here — Railpack already installs deps; a second ci hits EBUSY on cache mounts.

[build]
builder = "NIXPACKS"
buildCommand = "npm run build"

[deploy]
startCommand = "npm run start:railway"
healthcheckPath = "/api/health/mysql"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
