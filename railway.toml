# Railway config for Royal Tech LMS
# Dashboard overrides still work; this sets safe defaults.

[build]
builder = "NIXPACKS"
buildCommand = "npm ci && npm run build"

[deploy]
startCommand = "npm run start:railway"
healthcheckPath = "/api/health/mysql"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
